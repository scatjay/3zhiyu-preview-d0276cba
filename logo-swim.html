<!doctype html>
<html lang="zh-Hant">
<head><meta name="robots" content="noindex,nofollow"><style>html{visibility:hidden}</style><script type="module" src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三隻魚 · 左側游入轉身 原型 | 三知餘</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F7F5F0;color:#14202B;font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;gap:12px;align-content:center;padding:14px}
.stage{width:min(96vw,1100px);aspect-ratio:16/9;background:#F7F5F0;border:1px solid #DDD8CE;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 14px 40px -24px rgba(20,32,43,.35)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 .92rem "Noto Sans TC",sans-serif;padding:.5em 1.2em;border-radius:999px;border:2px solid #14202B;background:transparent;color:#14202B;cursor:pointer;transition:background .2s,color .2s}
button:hover{background:#14202B;color:#F7F5F0}
label{font-size:.85rem;color:#5B6773;display:flex;gap:6px;align-items:center}
small{color:#5B6773;text-align:center;max-width:640px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="c"></canvas></div>
  <div class="ctl">
    <button id="replay">重播</button>
    <button id="bg">換底色</button>
    <label>速度 <input id="spd" type="range" min="0.4" max="2" step="0.1" value="1"></label>
    <label>轉身力道 <input id="turn" type="range" min="0" max="2" step="0.1" value="1"></label>
    <label>身體波動 <input id="amp" type="range" min="0" max="2" step="0.1" value="1"></label>
  </div>
  <small>三隻魚從左邊快速游進來，接近定位時急轉身、尾巴甩一下就位。原型用程式把魚沿身體切成細條做彎曲，不是骨架動畫。</small>
</div>
<script>
const W = 1666, H = 1028;                       // logo 圖層座標
const CW = 2604, CH = 1464;                     // 舞台（16:9），logo 置中
const OX = (CW - W) / 2, OY = (CH - H) / 2 - 30;
const BOX = { fish_small: [456, 304, 834, 473], fish_big: [578, 220, 1144, 632], fish_red: [749, 366, 1184, 720] };
const START = { fish_small: 0.10, fish_big: 0.22, fish_red: 0.34 };   // 出發時間（快速接連）
const LANE_Y = { fish_small: -40, fish_big: 60, fish_red: 170 };       // 入場時的高度差（相對定位點）
const T_SWIM = 0.62, T_TURN = 0.26;                                    // 衝刺、轉身秒數
const c = document.getElementById('c'); c.width = CW; c.height = CH;
const ctx = c.getContext('2d');
const params = new URLSearchParams(location.search);
let SPD = 1, TURN = 1, AMP = 1;
const bgs = ['#F7F5F0', '#FAC02C', '#E8F1F7', '#FFF4D6']; let bgi = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t, k = 2.2) => 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2);

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

function prep(img, box) {
  const [bx, by, bx2, by2] = box, w = bx2 - bx, h = by2 - by;
  const crop = document.createElement('canvas'); crop.width = w; crop.height = h;
  const cctx = crop.getContext('2d'); cctx.drawImage(img, bx, by, w, h, 0, 0, w, h);
  const d = cctx.getImageData(0, 0, w, h).data;
  let n = 0, sx = 0, sy = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 128) { n++; sx += x; sy += y; }
  const cx = sx / n, cy = sy / n; let sxx = 0, syy = 0, sxy = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 128) { const dx = x - cx, dy = y - cy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  let th = 0.5 * Math.atan2(2 * sxy, sxx - syy), ux = Math.cos(th), uy = Math.sin(th);
  if (ux < 0) { ux = -ux; uy = -uy; }
  th = Math.atan2(uy, ux);
  const D = Math.ceil(Math.hypot(w, h));
  const al = document.createElement('canvas'); al.width = D; al.height = D;
  const a = al.getContext('2d'); a.translate(D / 2, D / 2); a.rotate(-th); a.translate(-cx, -cy); a.drawImage(crop, 0, 0);
  a.setTransform(1, 0, 0, 1, 0, 0);
  const ad = a.getImageData(0, 0, D, D).data;
  let minX = D, maxX = 0;
  for (let x = 0; x < D; x += 2) { for (let y = 0; y < D; y += 4) { if (ad[(y * D + x) * 4 + 3] > 20) { if (x < minX) minX = x; if (x > maxX) maxX = x; break; } } }
  return { al, D, th, gx: bx + cx, gy: by + cy, minX, maxX };
}

let F = {}, textImg;

function drawFish(f, name, t) {
  const tau = (t * SPD - START[name]);
  if (tau <= 0) return;
  const swimP = clamp(tau / T_SWIM), q = clamp((tau - T_SWIM) / T_TURN);
  // 位置：從舞台左外側衝到「定位點左後方」，再於轉身時滑入定位
  const fx = f.gx + OX, fy = f.gy + OY;
  const startX = -420, runup = 150;
  const approachX = fx - runup, approachY = fy + LANE_Y[name] * 0.15;
  let x, y;
  if (tau < T_SWIM) {
    const e = easeInOut(swimP);
    x = startX + (approachX - startX) * e;
    y = fy + LANE_Y[name] + (approachY - (fy + LANE_Y[name])) * e;
  } else {
    const e = easeOutCubic(q);
    x = approachX + (fx - approachX) * e;
    y = approachY + (fy - approachY) * e;
  }
  // 方向：衝刺時朝右（略低頭），轉身時用過衝曲線轉到定位朝向
  const th0 = 0.05;
  let th = th0;
  if (tau >= T_SWIM) th = th0 + (f.th - th0) * (1 + (easeOutBack(q) - 1) * TURN);
  if (q >= 1) th = f.th;
  // 彎曲：轉身時身體彎成 C 形，尾巴落後
  const bend = (tau >= T_SWIM && q < 1) ? 95 * TURN * Math.sin(Math.PI * Math.min(1, q * 1.15)) : 0;
  // 波動：衝刺時快速擺尾，轉身時甩一下，定位後輕微
  const settle = clamp((tau - T_SWIM - T_TURN) / 0.6);
  const idle = 5 * AMP, run = 30 * AMP, flick = 44 * AMP * TURN;
  const amp = tau < T_SWIM ? run : (q < 1 ? run + (flick - run) * Math.sin(Math.PI * q) : idle + (run * 0.4 - idle) * (1 - easeOutCubic(settle)));
  const w = 2 * Math.PI * (tau < T_SWIM ? 5.0 : 3.2) * 1;
  const N = 72, span = f.maxX - f.minX, sw = span / N;
  const off = i => {                                          // 第 i 條邊界的垂直位移（連續曲線）
    const s = 1 - i / N;                                      // s: 頭 0 → 尾 1
    return amp * Math.pow(s, 1.25) * Math.sin(2 * Math.PI * 1.5 * s - w * tau + START[name] * 9) + bend * s * s;
  };
  ctx.save();
  ctx.globalAlpha = clamp(tau * 10);
  ctx.translate(x, y); ctx.rotate(th);
  let yL = off(0);
  for (let i = 0; i < N; i++) {
    const yR = off(i + 1), sx = f.minX + i * sw;
    ctx.save();
    ctx.translate(sx - f.D / 2, yL);                         // 每條改用剪切（斜平行四邊形）接合相鄰邊界，消除階梯
    ctx.transform(1, (yR - yL) / sw, 0, 1, 0, 0);
    ctx.drawImage(f.al, sx, 0, sw + 1.2, f.D, 0, -f.D / 2, sw + 1.2, f.D);
    ctx.restore();
    yL = yR;
  }
  ctx.restore();
}

function render(t) {
  ctx.clearRect(0, 0, CW, CH);
  for (const n of ['fish_small', 'fish_big', 'fish_red']) drawFish(F[n], n, t);
  const t0 = (START.fish_red + T_SWIM + T_TURN) / SPD + 0.05, qq = clamp((t - t0) / 0.7);
  if (qq > 0) {
    const e = easeOutCubic(qq);
    ctx.save(); ctx.beginPath(); ctx.rect(OX, 0, W * (0.28 + 0.44 * e), CH); ctx.clip();
    ctx.globalAlpha = clamp(qq * 3); ctx.drawImage(textImg, OX, OY); ctx.restore();
  }
}

let start = performance.now();
function loop() { render((performance.now() - start) / 1000); requestAnimationFrame(loop); }
(async () => {
  const [a, b, r, tx] = await Promise.all(['fish_small', 'fish_big', 'fish_red', 'text'].map(n => load('logo-layers/' + n + '.png')));
  F.fish_small = prep(a, BOX.fish_small); F.fish_big = prep(b, BOX.fish_big); F.fish_red = prep(r, BOX.fish_red); textImg = tx;
  window.__ready = true; window.render = render;
  if (params.has('t')) render(parseFloat(params.get('t'))); else loop();
})();
document.getElementById('replay').onclick = () => { start = performance.now(); };
document.getElementById('bg').onclick = () => { bgi = (bgi + 1) % bgs.length; document.getElementById('stage').style.background = bgs[bgi]; start = performance.now(); };
document.getElementById('spd').oninput = e => { SPD = +e.target.value; };
document.getElementById('turn').oninput = e => { TURN = +e.target.value; };
document.getElementById('amp').oninput = e => { AMP = +e.target.value; };
</script>
</body>
</html>
