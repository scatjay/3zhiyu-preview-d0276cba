<!doctype html>
<html lang="zh-Hant">
<head><meta name="robots" content="noindex,nofollow"><style>html{visibility:hidden}</style><script type="module" src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三知餘 CIS 形象動畫 | Logo MG</title>
<style>
:root{--yellow:#FAC02C;--ink:#1B0C0A;--blue:#116FB8;--red:#C30F23;--cream:#FFF4D6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F7F5F0;color:#14202B;font:15px/1.6 "Noto Sans TC",system-ui,sans-serif}
.wrap{min-height:100%;display:grid;place-items:center;padding:16px;gap:14px;align-content:center}
.stage{position:relative;width:min(96vw,1100px);aspect-ratio:16/9;background:#F7F5F0;border:1px solid #DDD8CE;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px -24px rgba(20,32,43,.35)}
/* 水波 */
.ripples{position:absolute;inset:0;width:100%;height:100%}
.ripples path{fill:none;stroke:#116FB8;stroke-opacity:.35;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.play .ripples path{animation:draw 1.6s cubic-bezier(.3,.7,.2,1) forwards}
.ripples path:nth-child(2){animation-delay:.15s!important}.ripples path:nth-child(3){animation-delay:.3s!important}
.ripples path:nth-child(4){animation-delay:.45s!important}.ripples path:nth-child(5){animation-delay:.6s!important}
@keyframes draw{to{stroke-dashoffset:0}}
/* 標誌容器：把 1666x1028 的圖層對齊並置中 */
.logo{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1666/1028;transform:translate(-50%,-52%)}
.logo img{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:transform,opacity}
.play .fish{animation-fill-mode:both}
.fish-small{--dx:-42%;--dy:30%}
.fish-big{--dx:-30%;--dy:36%}
.fish-red{--dx:-36%;--dy:26%}
.play .fish-small{animation:swim 1.25s cubic-bezier(.2,1.2,.3,1) .35s both,bob 5.2s ease-in-out 3s infinite}
.play .fish-big  {animation:swim 1.35s cubic-bezier(.2,1.2,.3,1) .7s both,bob 6s ease-in-out 3.2s infinite reverse}
.play .fish-red  {animation:swim 1.25s cubic-bezier(.2,1.2,.3,1) 1.05s both,bob 5.6s ease-in-out 3.4s infinite}
@keyframes swim{
  0%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-14deg) scale(.82)}
  18%{opacity:1}
  70%{transform:translate(1.2%,-1.4%) rotate(2deg) scale(1.02)}
  100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(.5%,-1.6%) rotate(-1.2deg)}}
/* 文字：由左到右揭示 */
.text{clip-path:inset(0 100% 0 0)}
.play .text{animation:reveal 1.1s cubic-bezier(.6,0,.2,1) 2s forwards}
@keyframes reveal{to{opacity:1;clip-path:inset(0 0 0 0)}}
/* 收尾的光點 */
.spark{position:absolute;border-radius:50%;background:#116FB8;opacity:0;width:1.2%;aspect-ratio:1}
.play .spark{animation:twinkle 1.6s ease-out 2.9s forwards}
.spark.a{left:62%;top:30%}.spark.b{left:70%;top:44%;animation-delay:3.1s!important}.spark.c{left:34%;top:42%;animation-delay:3.3s!important}
@keyframes twinkle{0%{opacity:0;transform:scale(.2)}30%{opacity:.95;transform:scale(1.6)}100%{opacity:0;transform:scale(.6)}}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:700 .92rem "Noto Sans TC",sans-serif;padding:.5em 1.2em;border-radius:999px;border:2px solid #14202B;background:transparent;color:#14202B;cursor:pointer;transition:background .2s,color .2s}
button:hover{background:#14202B;color:#F7F5F0}
small{color:#5B6773}
@media (prefers-reduced-motion:reduce){.logo img{opacity:1!important;transform:none!important;animation:none!important;clip-path:none!important}.ripples path{stroke-dashoffset:0!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage play" id="stage">
    <svg class="ripples" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <path pathLength="1" d="M-20 700 C 250 640, 420 760, 700 690 S 1200 620, 1640 700"/>
      <path pathLength="1" d="M-20 760 C 300 700, 520 820, 820 750 S 1250 690, 1640 760"/>
      <path pathLength="1" d="M-20 150 C 260 90, 480 200, 760 140 S 1200 90, 1640 160"/>
      <path pathLength="1" d="M-20 215 C 320 150, 520 270, 840 205 S 1250 160, 1640 220"/>
      <path pathLength="1" d="M-20 480 C 150 450, 260 520, 400 485"/>
    </svg>
    <div class="logo">
      <img class="fish fish-small" src="logo-layers/fish_small.png" alt="">
      <img class="fish fish-big"   src="logo-layers/fish_big.png"   alt="">
      <img class="fish fish-red"   src="logo-layers/fish_red.png"   alt="">
      <img class="text"            src="logo-layers/text.png"       alt="三知餘文化">
    </div>
    <i class="spark a"></i><i class="spark b"></i><i class="spark c"></i>
  </div>
  <div class="ctl"><button id="replay">重播</button><button id="bg">換底色</button></div>
  <small>三知餘文化有限公司 · CIS 形象動畫草稿｜色票 墨黑 #1B0C0A · 魚藍 #116FB8 · 魚紅 #C30F23 · 主黃 #FAC02C</small>
</div>
<script>
const st=document.getElementById('stage');
function play(){st.classList.remove('play');void st.offsetWidth;st.classList.add('play')}
document.getElementById('replay').onclick=play;
const bgs=['#F7F5F0','#FAC02C','#E8F1F7','#FFF4D6'];let i=0;
document.getElementById('bg').onclick=()=>{i=(i+1)%bgs.length;st.style.background=bgs[i];play()};
</script>
</body>
</html>
